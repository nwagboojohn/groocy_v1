{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Confirm | Groocy</title>
    <meta name="author" content="Groocy">
    <meta name="description" content="Groocy is your go-to app for fast delivery, groceries, and essentials.">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{% static 'css/signup_login.css' %}">
    <link rel="shortcut icon" href="{% static 'images/groocy-head-logo.png' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Code+Latin:wght@100..700&family=Quicksand:wght@300..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- sign up section -->
    <section class="sign-up">
        <img class="logo" src="{% static 'images/groocy-logo.png' %}" alt="">
        <h2>Verify OTP</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="form-detail">
            {% csrf_token %}
            <label for="otp">6-Digit Code</label>
            <input type="text" name="otp" class="input-field" id="otp" placeholder="123456" required>

            <div class="text-field">
                <label for="password">New Password</label>
                <div class="password-fill">
                    <input type="password" class="input-field" id="password" name="password" required>
                    <p class="display-password">Show</p>
                </div>
            </div>
            <button type="submit" class="submit-btn">Update Password</button>

            <div style="margin-top: 15px; text-align: center;">
                <p id="timer-text" style="color: #5f5f5f; font-size: 0.87rem;">
                    Resend code in <span id="timer">5</span>m
                </p>
                <a href="{% url 'password_reset' %}" id="resend-link" style="display: none; color: #4CAF50; font-weight: 600; text-decoration: none;">
                    Resend Code
                </a>
            </div>
        </form>
    </section>

    <script>
        // JavaScript for password toggle 
        document.querySelectorAll('.display-password').forEach(button => {
            button.addEventListener('click', function() {
                const passwordInput = this.previousElementSibling;
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    this.textContent = 'Show';
                }
            });
        });

        // Change 60 to 300 (5 minutes * 60 seconds)
        let timeLeft = 300; 
        const timerElement = document.getElementById('timer');
        const resendLink = document.getElementById('resend-link');
        const timerText = document.getElementById('timer-text');

        const countdown = setInterval(() => {
            timeLeft--;
            
            // Optional: Format time to M:SS (e.g., 4:59)
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            let formattedTime = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            // Update display with formatted time
            timerElement.innerText = formattedTime;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.style.display = "none";
                resendLink.style.display = "block";
            }
        }, 1000);

    </script>

    
    <script>
        
    </script>
</body>
</html>
